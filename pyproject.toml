[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-obf"
version = "1.0.0"
description = "VM-based source obfuscator/compiler for Lua 5.1 and Luau"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vault-Obf Contributors" }]
keywords = ["lua", "luau", "obfuscator", "vm", "compiler", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
web = ["fastapi>=0.100", "uvicorn>=0.23", "python-multipart>=0.0.7"]
tests = ["pytest>=7.0", "httpx>=0.24"]

[project.scripts]
vault-obf = "vault.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vault*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]