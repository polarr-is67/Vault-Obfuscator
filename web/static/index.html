<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault-Obf</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, Consolas, monospace; margin: 2rem auto; max-width: 900px; padding: 0 1rem; background: #0f1117; color: #d6d8de; }
  h1 { font-size: 1.4rem; color: #79c0ff; }
  textarea { width: 100%; min-height: 10rem; background: #161b22; color: #d6d8de; border: 1px solid #30363d; border-radius: 6px; padding: .5rem; box-sizing: border-box; }
  label { display: block; margin-top: .75rem; font-size: .85rem; color: #8b949e; }
  input, select { background: #161b22; color: #d6d8de; border: 1px solid #30363d; border-radius: 6px; padding: .35rem .5rem; }
  button { margin-top: 1rem; background: #238636; color: #fff; border: 0; border-radius: 6px; padding: .55rem 1.2rem; cursor: pointer; font-size: .95rem; }
  button:hover { background: #2ea043; }
  pre { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: .75rem; overflow-x: auto; max-height: 24rem; }
  .error { color: #f85149; }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 12rem; }
</style>
</head>
<body>
<h1>Vault-Obf</h1>
<p>Compile Lua 5.1 / Luau source into a self-contained VM-protected script.</p>

<label for="src">Lua source</label>
<textarea id="src" spellcheck="false">print("hello")
local function fact(n)
    if n <= 1 then return 1 end
    return n * fact(n - 1)
end
print(fact(5))</textarea>

<div class="row">
  <div>
    <label for="preset">Preset</label>
    <select id="preset">
      <option value="low">low</option>
      <option value="medium" selected>medium</option>
      <option value="strong">strong</option>
    </select>
  </div>
  <div>
    <label for="target">Target</label>
    <select id="target">
      <option value="lua51" selected>lua51</option>
      <option value="luau">luau</option>
    </select>
  </div>
  <div>
    <label for="seed">Seed (0 = random)</label>
    <input id="seed" type="number" value="0">
  </div>
  <div>
    <label for="format">Format</label>
    <select id="format">
      <option value="minify">minify</option>
      <option value="pretty" selected>pretty</option>
    </select>
  </div>
</div>

<div>
  <label><input id="verify" type="checkbox"> verify output well-formedness</label>
</div>

<button onclick="run()">Obfuscate</button>
<div id="out-wrap" style="display:none; margin-top: 1rem;">
  <label for="out">Output</label>
  <textarea id="out" readonly style="min-height: 12rem;"></textarea>
  <div id="meta" style="font-size: .8rem; color: #8b949e; margin-top: .5rem;"></div>
</div>
<div id="err" class="error"></div>

<script>
async function run() {
  const err = document.getElementById("err");
  err.textContent = "";
  const payload = {
    source: document.getElementById("src").value,
    preset: document.getElementById("preset").value,
    target: document.getElementById("target").value,
    seed: Number(document.getElementById("seed").value) || 0,
    pretty: document.getElementById("format").value === "pretty",
    minify: document.getElementById("format").value === "minify",
    verify: document.getElementById("verify").checked,
  };
  let resp;
  try {
    resp = await fetch("/obfuscate.json", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
  } catch (e) {
    err.textContent = "network error: " + e.message;
    return;
  }
  const data = await resp.json();
  if (!resp.ok) {
    err.textContent = data.detail || resp.statusText;
    return;
  }
  document.getElementById("out").value = data.output;
  const s = data.stats;
  document.getElementById("meta").textContent =
    `seed ${s.seed} | ${s.source_size} -> ${s.output_size} bytes | ` +
    `${s.instruction_count} instr / ${s.function_count} fns / ${s.constant_count} consts | ` +
    `${s.compile_time_ms} ms`;
  document.getElementById("out-wrap").style.display = "block";
}
</script>
</body>
</html>
